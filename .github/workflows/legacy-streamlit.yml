name: Legacy Streamlit validation
on:
  push:
    paths: ['app.py', 'legacy_streamlit/**', 'requirements.txt', 'tests/legacy_streamlit/**', 'scripts/check_legacy_frontend.py', '.github/workflows/legacy-streamlit.yml']
  pull_request:
    paths: ['app.py', 'legacy_streamlit/**', 'requirements.txt', 'tests/legacy_streamlit/**', 'scripts/check_legacy_frontend.py', '.github/workflows/legacy-streamlit.yml']
permissions:
  contents: read
jobs:
  native-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade -r requirements.txt pytest==9.1.1 ruff==0.16.3
      - run: python -m pip check
      - run: python scripts/check_legacy_frontend.py
      - run: python -m ruff check app.py legacy_streamlit tests/legacy_streamlit scripts/check_legacy_frontend.py
      - run: python -m pytest -c tests/legacy_streamlit/pytest.ini tests/legacy_streamlit
